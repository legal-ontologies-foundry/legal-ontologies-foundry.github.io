name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'   # hourly fallback; GitHub may run scheduled jobs less often
  # Refresh the Activity pages whenever something happens, so they are current within minutes.
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, closed, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  discussion:
    types: [created, edited, answered]
  discussion_comment:
    types: [created, edited]
permissions:
  contents: write
  issues: read
  pull-requests: read
  discussions: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always build the published site, never a proposal's code
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      - name: Validate registry and generate pages and w3id redirects
        run: python scripts/build_registry.py
      - name: Publish w3id .htaccess for the w3id.org pull request
        uses: actions/upload-artifact@v4
        with:
          name: w3id-lof
          path: build/w3id/lof/
          include-hidden-files: true
      - name: Generate Activity pages from issues, pull requests, and Discussions
        run: python scripts/build_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdocs gh-deploy --force
