   name: deploy
   on:
     push:
       branches: [main]
     workflow_dispatch:
   permissions:
     contents: write
   jobs:
     deploy:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: 3.x
         - run: pip install -r requirements.txt
         - name: Validate registry and generate pages and w3id redirects
           run: python scripts/build_registry.py
         - name: Publish w3id .htaccess for the w3id.org pull request
           uses: actions/upload-artifact@v4
           with:
             name: w3id-lof
             path: build/w3id/lof/
             include-hidden-files: true
         - run: mkdocs gh-deploy --force
